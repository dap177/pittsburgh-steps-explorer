runtime: python39 # Or python38, python310, etc., depending on your preference
entrypoint: gunicorn -b :$PORT app:app

# Optional: Set environment variables here, BUT DO NOT COMMIT YOUR API KEY HERE
# env_variables:
#  EXAMPLE_VAR: 'example_value'

# Instance class settings for cost optimization
instance_class: F1 # F1 is the smallest/cheapest, suitable for low traffic

# Automatic scaling settings to reduce costs
automatic_scaling:
  min_instances: 0  # Scale to zero when not in use
  max_instances: 2  # Limit maximum instances
  target_cpu_utilization: 0.65
  target_throughput_utilization: 0.65
  min_pending_latency: 30ms
  max_pending_latency: automatic
  max_concurrent_requests: 10

handlers:
# Route static assets handled by Google's infrastructure
- url: /static
  static_dir: static

# Route all other requests to the Flask app
- url: /.*
  script: auto
